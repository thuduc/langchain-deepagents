<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI Projects</title>
    <meta name="description" content="Project-scoped GenAI workspace with dynamic skills, data, and chat sessions.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <button class="icon-button sidebar-collapse-btn" id="sidebar-collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M9 5v14"></path></svg>
                </button>
                <button class="icon-button" id="mobile-close-btn" title="Close sidebar" aria-label="Close sidebar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
                </button>
            </div>

            <section class="nav-section">
                <div class="section-header">
                    <span>Projects</span>
                    <div class="section-actions">
                        <button class="icon-button" id="add-project-btn" title="Add project" aria-label="Add project">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="list" id="project-list"></div>
            </section>

            <section class="nav-section sessions-section">
                <div class="section-header">
                    <span>Chats</span>
                </div>
                <div class="list" id="session-list"></div>
            </section>

            <footer class="sidebar-footer">
                <button class="settings-button" id="settings-btn" type="button" title="Settings" aria-label="Settings">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2.05 2.05 0 0 1-2.9 2.9l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V21a2.05 2.05 0 0 1-4.1 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2.05 2.05 0 0 1-2.9-2.9l.06-.06a1.7 1.7 0 0 0 .34-1.88 1.7 1.7 0 0 0-1.55-1H3a2.05 2.05 0 0 1 0-4.1h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2.05 2.05 0 0 1 2.9-2.9l.06.06a1.7 1.7 0 0 0 1.88.34h.01a1.7 1.7 0 0 0 1-1.55V3a2.05 2.05 0 0 1 4.1 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.88-.34l.06-.06a2.05 2.05 0 0 1 2.9 2.9l-.06.06a1.7 1.7 0 0 0-.34 1.88v.01a1.7 1.7 0 0 0 1.55 1H21a2.05 2.05 0 0 1 0 4.1h-.09a1.7 1.7 0 0 0-1.55 1Z"></path></svg>
                    <span>Settings</span>
                </button>
            </footer>
        </aside>

        <main class="workspace">
            <header class="workspace-header">
                <button class="icon-button mobile-menu" id="mobile-menu-btn" title="Open sidebar" aria-label="Open sidebar">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
                </button>
                <div class="workspace-title">
                    <strong id="project-title">No project selected</strong>
                    <span id="session-title">Select a project to begin</span>
                </div>
                <div class="workspace-actions">
                    <div class="run-status hidden" id="run-status" role="status" aria-live="polite">
                        <span class="status-dot"></span>
                        <span id="run-status-text">Idle</span>
                    </div>
                    <button class="meta-button hidden" id="isolation-btn" type="button">Isolation</button>
                    <button class="icon-button" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 6 6 0 0 1-9-9Z"></path></svg>
                    </button>
                </div>
            </header>
            <div class="workspace-meta hidden" id="workspace-meta"></div>

            <section class="messages" id="chat-log">
                <div class="empty-state" id="empty-state">
                    <h1>Select a project</h1>
                    <p>Choose a project from the sidebar to load its skills, data, and chat sessions.</p>
                </div>
            </section>

            <footer class="composer">
                <div class="artifact-strip hidden" id="artifact-strip"></div>
                <div class="composer-box">
                    <textarea id="prompt-input" rows="1" placeholder="Select a project to start" disabled></textarea>
                    <button class="send-button" id="send-btn" title="Send" aria-label="Send" disabled>↑</button>
                </div>
                <div class="hint" id="composer-hint">Prompts are scoped to the selected project.</div>
            </footer>
        </main>
    </div>

    <div class="modal-backdrop hidden" id="content-modal">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <h2>Project Contents</h2>
                    <p id="content-subtitle"></p>
                </div>
                <button class="icon-button" data-close-modal="content-modal" aria-label="Close">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
                </button>
            </div>
            <div class="file-tree" id="content-tree"></div>
        </div>
    </div>

    <div class="modal-backdrop hidden" id="upload-modal">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <h2>Review ZIP Import</h2>
                    <p id="upload-summary"></p>
                </div>
                <button class="icon-button" data-close-modal="upload-modal" aria-label="Close">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
                </button>
            </div>
            <div class="import-options">
                <label>
                    Mode
                    <select id="import-mode">
                        <option value="merge">Merge with existing content</option>
                        <option value="replace">Replace existing content</option>
                    </select>
                </label>
            </div>
            <div class="file-tree" id="upload-tree"></div>
            <div class="modal-actions">
                <button class="secondary-action" data-close-modal="upload-modal">Cancel</button>
                <button class="primary-action" id="confirm-import-btn">Import</button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop hidden" id="settings-modal">
        <div class="modal settings-modal">
            <div class="modal-header">
                <div>
                    <h2>Settings</h2>
                </div>
                <button class="icon-button" data-close-modal="settings-modal" aria-label="Close">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
                </button>
            </div>
            <div class="settings-form">
                <label class="settings-field">
                    <span>Default Model</span>
                    <select id="settings-default-model"></select>
                </label>
                <label class="settings-field">
                    <span>Max Sessions Per Project</span>
                    <input id="settings-max-sessions" type="number" min="1" max="100" step="1">
                </label>
                <p class="settings-status" id="settings-status" role="status"></p>
            </div>
            <div class="modal-actions">
                <button class="secondary-action" data-close-modal="settings-modal">Cancel</button>
                <button class="primary-action" id="save-settings-btn">Save</button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop hidden" id="isolation-modal">
        <div class="modal isolation-modal">
            <div class="modal-header">
                <div>
                    <h2>Project Isolation</h2>
                    <p id="isolation-subtitle"></p>
                </div>
                <button class="icon-button" data-close-modal="isolation-modal" aria-label="Close">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
                </button>
            </div>
            <div class="isolation-body" id="isolation-body"></div>
        </div>
    </div>

    <div class="project-menu hidden" id="project-menu">
        <button type="button" data-project-action="contents">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18"></path><path d="M3 12h18"></path><path d="M3 17h18"></path></svg>
            <span>Contents</span>
        </button>
        <button type="button" data-project-action="upload">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 8 5-5 5 5"></path><path d="M5 15v4h14v-4"></path></svg>
            <span>Upload</span>
        </button>
        <button type="button" class="danger-menu-item" data-project-action="delete">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M6 7l1 14h10l1-14"></path><path d="M9 7V4h6v3"></path></svg>
            <span>Delete</span>
        </button>
    </div>

    <input type="file" id="zip-file-input" accept=".zip,application/zip" hidden>
    <script src="/static/app.js"></script>
</body>
</html>
