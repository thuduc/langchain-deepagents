AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Sandboxed code execution for the Deep Agents workspace. Creates an isolated VPC
  with no internet route, an S3 bucket for project data and run artifacts, a
  VPC-mode AgentCore code interpreter, and two IAM roles whose split is the core
  of the security model.

Parameters:
  ProjectName:
    Type: String
    Default: deepagents
    AllowedPattern: "[a-z][a-z0-9-]{2,20}"
    Description: Prefix for resource names. Lowercase letters, digits and hyphens.

  DevPrincipalArn:
    Type: String
    Default: ""
    Description: >
      IAM user or role allowed to mint scoped sandbox credentials from a laptop.
      Leave empty in production. Example: arn:aws:iam::111122223333:user/duc

  TaskRoleArn:
    Type: String
    Default: ""
    Description: >
      ECS task role allowed to mint scoped sandbox credentials. Leave empty until
      the Fargate service exists.

  EnableDnsFirewall:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Blocks DNS lookups for anything other than AWS service domains. Closes the
      DNS tunnelling path that security researchers demonstrated out of AgentCore
      sandboxes. Costs roughly one dollar per month.

Conditions:
  HasDevPrincipal: !Not [!Equals [!Ref DevPrincipalArn, ""]]
  HasTaskRole: !Not [!Equals [!Ref TaskRoleArn, ""]]
  WantsDnsFirewall: !Equals [!Ref EnableDnsFirewall, "true"]

Resources:

  # ---------------------------------------------------------------------------
  # Storage. Project data goes in under projects/, run outputs under artifacts/.
  # ---------------------------------------------------------------------------

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-sandbox-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbandonedUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 3
          - Id: ExpireOldArtifactVersions
            Status: Enabled
            Prefix: artifacts/
            NoncurrentVersionExpirationInDays: 30
          # The sandbox uploads here and the server copies anything worth keeping
          # into artifacts/. Nothing needs to survive the run that produced it.
          - Id: ExpireSandboxStaging
            Status: Enabled
            Prefix: staging/
            ExpirationInDays: 1
            NoncurrentVersionExpirationInDays: 1

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # ---------------------------------------------------------------------------
  # Network. No internet gateway and no NAT, so there is no route off this VPC
  # except the S3 gateway endpoint below. Routing is the control here, not the
  # security group.
  # ---------------------------------------------------------------------------

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sandbox"

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sandbox-a"

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sandbox-b"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sandbox-private"

  SubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  SubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  SandboxSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Code interpreter sandbox. Reaches S3 only, via the gateway endpoint.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to S3 through the gateway endpoint; no internet route exists
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-sandbox"

  # The endpoint policy is what stops generated code copying project data into
  # someone else's bucket. Without it, S3 is an exfiltration channel.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ThisBucketOnly
            Effect: Allow
            Principal: "*"
            Action:
              - "s3:GetObject"
              - "s3:PutObject"
              - "s3:ListBucket"
              - "s3:AbortMultipartUpload"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"

  # ---------------------------------------------------------------------------
  # DNS firewall. Allows AWS service names, blocks everything else.
  # ---------------------------------------------------------------------------

  AllowedDomains:
    Type: AWS::Route53Resolver::FirewallDomainList
    Condition: WantsDnsFirewall
    Properties:
      Name: !Sub "${ProjectName}-sandbox-allowed"
      Domains:
        - "*.amazonaws.com"

  BlockedDomains:
    Type: AWS::Route53Resolver::FirewallDomainList
    Condition: WantsDnsFirewall
    Properties:
      Name: !Sub "${ProjectName}-sandbox-blocked"
      Domains:
        - "*"

  DnsFirewallRuleGroup:
    Type: AWS::Route53Resolver::FirewallRuleGroup
    Condition: WantsDnsFirewall
    Properties:
      Name: !Sub "${ProjectName}-sandbox-dns"
      FirewallRules:
        - FirewallDomainListId: !Ref AllowedDomains
          Priority: 10
          Action: ALLOW
        - FirewallDomainListId: !Ref BlockedDomains
          Priority: 20
          Action: BLOCK
          BlockResponse: NODATA

  DnsFirewallAssociation:
    Type: AWS::Route53Resolver::FirewallRuleGroupAssociation
    Condition: WantsDnsFirewall
    Properties:
      Name: !Sub "${ProjectName}-sandbox-dns"
      FirewallRuleGroupId: !Ref DnsFirewallRuleGroup
      VpcId: !Ref Vpc
      Priority: 101

  # ---------------------------------------------------------------------------
  # Identity. Two roles, and the split between them is the whole security model.
  # ---------------------------------------------------------------------------

  # Attached to the code interpreter, so generated code can read its credentials
  # from the microVM metadata service. It therefore grants nothing at all.
  InterpreterExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-sandbox-execution"
      Description: Intentionally powerless. Generated code can steal these credentials.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
              ArnLike:
                "aws:SourceArn": !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"

  # Assumed by the server, never by the sandbox. Session tags narrow it to one
  # project and one run, so a missing tag denies rather than widens.
  DataAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-sandbox-data"
      Description: Minted per run with session tags. Never attached to the interpreter.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - !If
            - HasDevPrincipal
            - Effect: Allow
              Principal:
                AWS: !Ref DevPrincipalArn
              Action:
                - "sts:AssumeRole"
                - "sts:TagSession"
            - !Ref AWS::NoValue
          - !If
            - HasTaskRole
            - Effect: Allow
              Principal:
                AWS: !Ref TaskRoleArn
              Action:
                - "sts:AssumeRole"
                - "sts:TagSession"
            - !Ref AWS::NoValue
      Policies:
        - PolicyName: ScopedBySessionTags
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOwnProject
                Effect: Allow
                Action: "s3:GetObject"
                Resource: !Sub "${DataBucket.Arn}/projects/${!aws:PrincipalTag/slug}/*"
                Condition:
                  "Null":
                    "aws:PrincipalTag/slug": "false"
              - Sid: ListOwnProject
                Effect: Allow
                Action: "s3:ListBucket"
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    "s3:prefix":
                      - !Sub "projects/${!aws:PrincipalTag/slug}/*"
                  "Null":
                    "aws:PrincipalTag/slug": "false"
              - Sid: WriteOwnRunOnly
                Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:AbortMultipartUpload"
                # One tag, not four: AWS packs session tags and the session
                # policy into a single small budget that four ids overflow. The
                # value is path-shaped ("<user>/<project>/<session>/<run>") and
                # server-derived, and IAM tag values cannot contain '*', so it
                # cannot widen this ARN.
                Resource: !Sub "${DataBucket.Arn}/staging/${!aws:PrincipalTag/run}/*"
                Condition:
                  "Null":
                    "aws:PrincipalTag/run": "false"

  # Permissions the application itself needs. Attach to the ECS task role, or to
  # your laptop user for local testing.
  ApplicationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-sandbox-application"
      Description: Drive the code interpreter, mint scoped credentials, read artifacts back.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DriveCodeInterpreter
            Effect: Allow
            Action:
              - "bedrock-agentcore:StartCodeInterpreterSession"
              - "bedrock-agentcore:InvokeCodeInterpreter"
              - "bedrock-agentcore:StopCodeInterpreterSession"
              - "bedrock-agentcore:GetCodeInterpreterSession"
              - "bedrock-agentcore:ListCodeInterpreterSessions"
            Resource: !GetAtt CodeInterpreter.CodeInterpreterArn
          - Sid: InspectCodeInterpreter
            Effect: Allow
            Action: "bedrock-agentcore:GetCodeInterpreter"
            Resource: !GetAtt CodeInterpreter.CodeInterpreterArn
          - Sid: MintScopedCredentials
            Effect: Allow
            Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
            Resource: !GetAtt DataAccessRole.Arn
          - Sid: ManageProjectDataAndArtifacts
            Effect: Allow
            Action:
              - "s3:GetObject"
              - "s3:PutObject"
              - "s3:DeleteObject"
              - "s3:ListBucket"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"

  # ---------------------------------------------------------------------------
  # The sandbox itself.
  # ---------------------------------------------------------------------------

  CodeInterpreter:
    Type: AWS::BedrockAgentCore::CodeInterpreterCustom
    Properties:
      Name: !Sub "${ProjectName}_sandbox"
      Description: Runs agent-generated Python for the Deep Agents workspace.
      ExecutionRoleArn: !GetAtt InterpreterExecutionRole.Arn
      NetworkConfiguration:
        NetworkMode: VPC
        VpcConfig:
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
          SecurityGroups:
            - !Ref SandboxSecurityGroup

Outputs:
  SandboxBucket:
    Description: Set as AGENTCORE_BUCKET
    Value: !Ref DataBucket

  CodeInterpreterId:
    Description: Set as AGENTCORE_INTERPRETER_ID
    Value: !GetAtt CodeInterpreter.CodeInterpreterId

  DataAccessRoleArn:
    Description: Set as AGENTCORE_DATA_ACCESS_ROLE_ARN
    Value: !GetAtt DataAccessRole.Arn

  Region:
    Description: Set as AGENTCORE_REGION
    Value: !Ref AWS::Region

  ApplicationPolicyArn:
    Description: Attach this managed policy to your laptop user or ECS task role
    Value: !Ref ApplicationPolicy

  EnvBlock:
    Description: Copy these lines into your .env
    Value: !Sub
      - "DEEP_AGENTS_SANDBOX=agentcore AGENTCORE_REGION=${AWS::Region} AGENTCORE_BUCKET=${Bucket} AGENTCORE_INTERPRETER_ID=${InterpreterId} AGENTCORE_DATA_ACCESS_ROLE_ARN=${RoleArn}"
      - Bucket: !Ref DataBucket
        InterpreterId: !GetAtt CodeInterpreter.CodeInterpreterId
        RoleArn: !GetAtt DataAccessRole.Arn
