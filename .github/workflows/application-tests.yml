name: Application tests

on:
  pull_request:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deep-agents-sdk/requirements.txt
            deep-agents-sdk/requirements-dev.txt
      - run: python -m pip install -r deep-agents-sdk/requirements-dev.txt
      - run: ruff check deep-agents-sdk/deep_agents_app deep-agents-sdk/server.py deep-agents-sdk/tests --select E4,E7,E9,F
      - run: vulture deep-agents-sdk/deep_agents_app deep-agents-sdk/server.py deep-agents-sdk/tests --min-confidence 80
      - run: python -m unittest discover -s deep-agents-sdk/tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deep-agents-sdk/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deep-agents-sdk/frontend/package-lock.json
      - run: npm ci
      - run: npm run deadcode
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
